<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/9fab3baa39.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <form>
            <h1>Sign Up</h1>
            <label>First Name</label>
            <input type="text" id="First_Name" class="inp" required>
            <label>Last Name</label>
            <input type="text" id="Last_Name" class="inp" required>
            <label>Email</label>
            <input type="email" id="Email_Id" class="inp" required>
            <label>Set Password</label>
            <input type="password" id="Password" class="inp" required>
            <label>Confirm Password</label>
            <input type="password" id="cnf_Password" class="inp" required>
            <i class="fa-solid fa-circle-check" onclick="checkpass()" id="logo"></i>
            <div id="error"></div>
            <label>Date of Birth</label>
            <input type="date" id="DOB" class="inp" required><br><br>
            <input type="submit" value="Submit" onclick="get()" id="submit_btn">
        </form>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
